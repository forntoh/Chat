[versions]
kotlin = "2.4.0"
compose = "1.11.1"
material3 = "1.11.0-alpha07"
agp = "9.1.0"
tabler = "2.2.1"
activity = "1.13.0"
lifecycle = "2.11.0"
detekt = "1.23.8"
ktlint = "1.8.0"
android-compose-test = "1.11.2"
android-test = "1.8.0-alpha04"
espresso = "3.8.0-alpha04"
chat-staging = "0.1.0-local"

[libraries]
android-compose-test = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "android-compose-test" }
android-test-runner = { module = "androidx.test:runner", version.ref = "android-test" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel", version.ref = "lifecycle" }
detekt-cli = { module = "io.gitlab.arturbosch.detekt:detekt-cli", version.ref = "detekt" }
ktlint-cli = { module = "com.pinterest.ktlint:ktlint-cli", version.ref = "ktlint" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
compose-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose" }
tabler-icons = { group = "com.composables", name = "icons-tabler-outline-cmp", version.ref = "tabler" }
kotlin-gradle = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradle = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "compose" }
compose-compiler-gradle = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
android-gradle = { module = "com.android.tools.build:gradle", version.ref = "agp" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose" }
compose-animation = { module = "org.jetbrains.compose.animation:animation", version.ref = "compose" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose" }
compose-test = { module = "org.jetbrains.compose.ui:ui-test-junit4", version.ref = "compose" }
material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
desktop-macos-arm64 = { module = "org.jetbrains.compose.desktop:desktop-jvm-macos-arm64", version.ref = "compose" }
desktop-macos-x64 = { module = "org.jetbrains.compose.desktop:desktop-jvm-macos-x64", version.ref = "compose" }
desktop-linux-x64 = { module = "org.jetbrains.compose.desktop:desktop-jvm-linux-x64", version.ref = "compose" }
desktop-linux-arm64 = { module = "org.jetbrains.compose.desktop:desktop-jvm-linux-arm64", version.ref = "compose" }
desktop-windows-x64 = { module = "org.jetbrains.compose.desktop:desktop-jvm-windows-x64", version.ref = "compose" }
chat-core = { module = "dev.forntoh.chat.candidate:chat-core", version.ref = "chat-staging" }
chat-ui = { module = "dev.forntoh.chat.candidate:chat-ui", version.ref = "chat-staging" }
chat-material3 = { module = "dev.forntoh.chat.candidate:chat-material3", version.ref = "chat-staging" }
chat-actions = { module = "dev.forntoh.chat.candidate:chat-actions", version.ref = "chat-staging" }
chat-media = { module = "dev.forntoh.chat.candidate:chat-media", version.ref = "chat-staging" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
android-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
