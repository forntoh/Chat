name: Documentation Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '*.md'
      - 'myst.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@v5.0.0
        with:
          enablement: false
      - name: Install pinned documentation dependencies
        run: npm ci --ignore-scripts
      - name: Build documentation strictly for Pages
        env:
          BASE_URL: ${{ steps.pages.outputs.base_path }}
        run: npm run docs:build
      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v4.0.0
        with:
          path: _build/html/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5
