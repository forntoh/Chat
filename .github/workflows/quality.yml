name: Quality

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - '**/*.kt'
      - '**/*.kts'
      - '.editorconfig'
      - 'config/quality/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'docs/**'
      - '*.md'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/quality.yml'

permissions:
  contents: read

jobs:
  kotlin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Check Kotlin
        run: ./gradlew detekt ktlintCheck --continue
      - name: Preserve quality reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kotlin-quality
          path: build/reports/quality/
          if-no-files-found: ignore
          retention-days: 7
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install pinned documentation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-docs.txt
      - name: Build documentation strictly
        run: mkdocs build --strict
      - name: Preserve local site for inspection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: documentation-site
          path: site/
          retention-days: 7
